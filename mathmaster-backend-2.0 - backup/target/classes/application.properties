# ========== Servidor ==========
server.port=8080
# Permite enviar imagens em base64 no JSON (avatar/capa do perfil). Padr�o � 2MB.
server.tomcat.max-http-form-post-size=5MB

# ========== Banco de dados (MySQL) ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mathmaster?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Inicializa��o dos dados (data.sql)
spring.sql.init.mode=always

# ========== JWT ==========
